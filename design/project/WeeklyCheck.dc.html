<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>日曜日の2つの質問</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 12px; background: #F1F3F2; color: #1C2321; font-family: 'Zen Kaku Gothic New', sans-serif; word-break: auto-phrase">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="{{lk.close.href}}" onClick="{{lk.close.on}}" aria-label="閉じる" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1px solid #DCE1DF; color: #1C2321; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<span style="font-size: 15px; font-weight: 700; color: #34407A">週1回の2つの質問</span>
<a href="{{lk.consult.href}}" onClick="{{lk.consult.on}}" aria-label="相談する" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1px solid #DCE1DF; color: #34407A; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.4">この2週間を、<br>ふりかえります。</h1>
<p style="margin: 0; font-size: 14.5px; line-height: 1.7; color: #46514D">30秒で終わります。答えは、受診を考える目安にだけ使います。</p>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE1DF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span id="q1" style="font-size: 15.5px; font-weight: 700; line-height: 1.6">何をしても楽しめない、興味がわかない日は？</span>
<div role="group" aria-labelledby="q1" style="display: flex; gap: 6px">
<sc-for list="{{q1Opts}}" as="o" hint-placeholder-count="4">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 1; min-width: 0; min-height: 44px; padding: 0 2px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE1DF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span id="q2" style="font-size: 15.5px; font-weight: 700; line-height: 1.6">気分が落ち込む、ゆううつになる日は？</span>
<div role="group" aria-labelledby="q2" style="display: flex; gap: 6px">
<sc-for list="{{q2Opts}}" as="o" hint-placeholder-count="4">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 1; min-width: 0; min-height: 44px; padding: 0 2px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 13px; color: #56615D">2つ答えると、結果が出ます。</p>
</sc-if>

<sc-if value="{{high}}" hint-placeholder-val="{{ false }}">
<div aria-live="polite" style="background: #E3E8F4; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 700">この2週間、つらい日が多かったようです</span>
<span style="font-size: 13.5px; line-height: 1.6; color: #2C3550">受診を考えてみませんか。相談先と、受診の目安をまとめています。</span>
<a href="{{lk.consultRes.href}}" onClick="{{lk.consultRes.on}}" style="align-self: flex-start; margin-top: 6px; min-height: 48px; box-sizing: border-box; padding: 0 22px; border-radius: 999px; background: #34407A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 700">相談先を見る</a>
</div>
</sc-if>

<sc-if value="{{low}}" hint-placeholder-val="{{ false }}">
<div aria-live="polite" style="background: #FFFFFF; border: 1px solid #DCE1DF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 700">記録しました</span>
<span style="font-size: 13.5px; line-height: 1.6; color: #46514D">来週の日曜日に、また聞きます。</span>
<a href="{{lk.done.href}}" onClick="{{lk.done.on}}" style="align-self: flex-start; margin-top: 6px; min-height: 48px; box-sizing: border-box; padding: 0 22px; border-radius: 999px; background: #34407A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 700">チェックインに戻る</a>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nav":{"editor":null},"mode":{"editor":null},"days":{"editor":null},"scene":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q1: null, q2: null };
}
lk(target, fn) {
const nav = this.props.nav;
if (!nav) return { href: target + '.dc.html', on: null };
return {
href: '#',
on: (e) => {
if (e && e.preventDefault) e.preventDefault();
if (fn) fn(nav); else nav.go(target);
}
};
}
renderVals() {
const labels = ['ない', '数日', '半分以上', 'ほぼ毎日'];
const mk = (key) => labels.map((label, i) => {
const on = this.state[key] === i;
return {
label: label,
pressed: on,
bg: on ? '#34407A' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#1C2321',
bd: on ? '#34407A' : '#8A9490',
pick: () => {
const next = {};
next[key] = on ? null : i;
this.setState(next);
}
};
});
const done = this.state.q1 !== null && this.state.q2 !== null;
const score = done ? this.state.q1 + this.state.q2 : 0;
return {
q1Opts: mk('q1'),
q2Opts: mk('q2'),
notDone: !done,
high: done && score >= 3,
low: done && score < 3,
lk: {
close: this.lk('CheckIn', (n) => n.back()),
consult: this.lk('Consult'),
consultRes: this.lk('Consult'),
done: this.lk('CheckIn', (n) => n.back())
}
};
}
}
</script>
</body>
</html>
