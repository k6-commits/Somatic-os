<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム ひろげる日</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px; background: #F1F3F2; color: #1C2321; font-family: 'Zen Kaku Gothic New', sans-serif; word-break: auto-phrase">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="{{lk.sheet.href}}" onClick="{{lk.sheet.on}}" style="min-height: 44px; box-sizing: border-box; padding: 8px 14px 8px 10px; border-radius: 999px; background: #F0B44C; color: #1C2321; text-decoration: none; display: flex; align-items: center; gap: 8px">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #1C2321; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>
<span style="font-size: 15px; font-weight: 700">ひろげる日</span>
<span style="font-size: 12.5px; color: #3D2E0A">変更</span>
</a>
<a href="{{lk.consult.href}}" onClick="{{lk.consult.on}}" aria-label="相談する" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1px solid #DCE1DF; color: #34407A; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.3">きょうは、ひろげる日。</h1>
<p style="margin: 0; font-size: 15px; color: #56615D">余裕があれば、今週をふりかえってみましょう。</p>
</div>

<div style="background: #F0B44C; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12.5px; font-weight: 700; color: #3D2E0A">週1のふりかえり · 15分</span>
<sc-if value="{{hasWeek}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Zen Maru Gothic', sans-serif; font-size: 19px; font-weight: 700">今週のできたは16個</span>
</sc-if>
<sc-if value="{{noWeek}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 15px; font-weight: 700; line-height: 1.6">今週の記録が少したまったら、開けます</span>
</sc-if>
</div>
<sc-if value="{{hasWeek}}" hint-placeholder-val="{{ true }}">
<a href="{{lk.review.href}}" onClick="{{lk.review.on}}" style="flex: none; min-height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; background: #34407A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 700">はじめる</a>
</sc-if>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE1DF; border-radius: 22px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #E3E8F4; color: #34407A; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="20" height="20" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="13.5" cy="4.5" r="1.8"></circle><path d="M12.5 8L11 14l-2.5 6.5M11 14l3 3 .5 4M8 11.5L10 9l2.5-1 2.5 2.5 2.5.5"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 700">今週の歩き {{walkMin}}</span>
<span style="font-size: 12.5px; color: #56615D">{{walkGoal}}</span>
</div>
<button type="button" aria-label="歩いた時間を記録する" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #34407A; background: #FFFFFF; color: #34407A; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">＋ 記録</button>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE1DF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="時間帯" style="display: flex; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="flex: 1; min-height: 44px; border-radius: 14px; border: none; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px">{{t.name}}<sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{t.badgeBg}}; color: {{t.badgeFg}}; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">できた</span>{{t.badge}}</span></sc-if></button>
</sc-for>
</div>
<div role="group" aria-label="きょうのメニュー" style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button type="button" role="checkbox" aria-checked="{{it.done}}" onClick="{{it.toggle}}" style="width: 100%; min-height: 54px; box-sizing: border-box; padding: 8px 2px; border: none; border-bottom: 1px solid #EEF1EF; background: transparent; color: #1C2321; font-family: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; border: 2px solid {{it.boxBd}}; background: {{it.box}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<sc-if value="{{it.done}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" width="17" height="17" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15.5px; font-weight: 700"><sc-if value="{{it.star}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color: #34407A">★ </span></sc-if>{{it.label}}</span>
<sc-if value="{{it.hasSub}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12.5px; color: #56615D">{{it.sub}}</span>
</sc-if>
</span>
</button>
</sc-for>
</div>
<sc-if value="{{isNight}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; padding-top: 4px">
<label for="win-line-expand" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">きょうのできたを1行</label>
<input id="win-line-expand" type="text" placeholder="きょうのできたを1行" value="{{winText}}" onChange="{{onWin}}" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #8A9490; font-family: inherit; font-size: 15px; color: #1C2321">
<button type="button" onClick="{{saveWin}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #34407A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">記録</button>
</div>
</sc-if>
</div>

<nav aria-label="メインメニュー" style="margin: auto -20px 0; height: 76px; background: #FFFFFF; border-top: 1px solid #DCE1DF; display: flex; justify-content: space-around; align-items: center">
<a href="{{lk.home.href}}" onClick="{{lk.home.on}}" aria-current="page" style="min-width: 72px; min-height: 48px; color: #34407A; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>
きょう
</a>
<a href="{{lk.evidence.href}}" onClick="{{lk.evidence.on}}" style="min-width: 72px; min-height: 48px; color: #56615D; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="7" cy="16" r="3"></circle><circle cx="15" cy="17" r="3.5"></circle><circle cx="12" cy="9" r="3"></circle></svg>
きろく
</a>
<a href="{{lk.pause.href}}" onClick="{{lk.pause.on}}" style="min-width: 72px; min-height: 48px; color: #34407A; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #34407A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="17" height="17" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></span>
つらいとき
</a>
<a href="{{lk.insights.href}}" onClick="{{lk.insights.on}}" style="min-width: 72px; min-height: 48px; color: #56615D; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
わかったこと
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nav":{"editor":null},"mode":{"editor":null},"days":{"editor":null},"scene":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const fresh = props.days === 0 || props.scene === 'back';
this.state = { tab: fresh ? 'morning' : 'day', done: fresh ? { m4: true } : { m2: true, m4: true, d1: true }, winText: '' };
}
lk(target, fn) {
const nav = this.props.nav;
if (!nav) return { href: target + '.dc.html', on: null };
return {
href: '#',
on: (e) => {
if (e && e.preventDefault) e.preventDefault();
if (fn) fn(nav); else nav.go(target);
}
};
}
renderVals() {
const done = this.state.done;
const tab = this.state.tab;
const all = {
morning: [
{ id: 'm1', star: true, label: '同じ時刻に起きる', sub: '' },
{ id: 'm2', star: true, label: '1時間以内に外の光をあびる', sub: '' },
{ id: 'm3', star: true, label: '水を1杯、何か食べる', sub: '' },
{ id: 'm4', star: false, label: '睡眠・気分・疲れを記録する', sub: 'チェックインで完了' }
],
day: [
{ id: 'd1', star: true, label: '5分だけ外を歩く', sub: '' },
{ id: 'd2', star: false, label: '合計20〜30分歩く', sub: '少し息が上がる速さで' },
{ id: 'd3', star: false, label: '予定していた小さな活動を1つ', sub: '例：洗濯、メール1通' },
{ id: 'd4', star: false, label: 'だれかと短くやりとりする', sub: 'メッセージ1通でもいい' }
],
night: [
{ id: 'n2', star: false, label: '寝る前に、ため息呼吸を5分', sub: '' },
{ id: 'n3', star: true, label: '眠れなければ、一度布団を出る', sub: '眠くなってから戻る' }
]
};
const ids = { morning: ['m1', 'm2', 'm3', 'm4'], day: ['d1', 'd2', 'd3', 'd4'], night: ['n1', 'n2', 'n3'] };
const tabsDef = [{ key: 'morning', name: '朝' }, { key: 'day', name: '日中' }, { key: 'night', name: '夜' }];
const tabs = tabsDef.map((t) => {
const c = ids[t.key].filter((x) => done[x]).length;
const on = t.key === tab;
return {
name: t.name,
hasBadge: c > 0,
badge: String(c),
pressed: on,
bg: on ? '#34407A' : '#F1F3F2',
fg: on ? '#FFFFFF' : '#1C2321',
badgeBg: on ? '#FFFFFF' : '#34407A',
badgeFg: on ? '#34407A' : '#FFFFFF',
pick: () => this.setState({ tab: t.key })
};
});
const items = all[tab].map((it) => {
const d = !!done[it.id];
return Object.assign({}, it, {
hasSub: !!it.sub,
done: d,
box: d ? '#34407A' : '#FFFFFF',
boxBd: d ? '#34407A' : '#7A8581',
toggle: () => {
const next = Object.assign({}, done);
next[it.id] = !d;
this.setState({ done: next });
}
});
});
const fresh = this.props.days === 0 || this.props.scene === 'back';
let walkGoal = '2週目の目安は週75分';
if (this.props.scene === 'back') walkGoal = '再開は、1週目の週50分から';
else if (fresh) walkGoal = '1週目の目安は週50分';
return {
walkMin: fresh ? '0分' : '62分',
walkGoal: walkGoal,
hasWeek: !fresh,
noWeek: fresh,
tabs: tabs,
items: items,
isNight: tab === 'night',
winText: this.state.winText,
onWin: (e) => this.setState({ winText: e.target.value }),
saveWin: () => {
if (!this.state.winText.trim()) return;
this.setState({ winText: '', done: Object.assign({}, this.state.done, { n1: true }) });
},
lk: {
sheet: this.lk('ModeSheet', (n) => n.openSheet()),
consult: this.lk('Consult'),
review: this.lk('Review'),
home: this.lk('HomeExpand', () => {}),
evidence: this.lk('Evidence'),
pause: this.lk('Pause'),
insights: this.lk('Insights')
}
};
}
}
</script>
</body>
</html>
