<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム まもる日</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px; background: #E9EBF3; color: #1C2321; font-family: 'Zen Kaku Gothic New', sans-serif; word-break: auto-phrase">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="{{lk.sheet.href}}" onClick="{{lk.sheet.on}}" style="min-height: 44px; box-sizing: border-box; padding: 8px 14px 8px 10px; border-radius: 999px; background: #1B2140; color: #EEF0F8; text-decoration: none; display: flex; align-items: center; gap: 8px">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #E8D8A0; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
<span style="font-size: 15px; font-weight: 700">まもる日</span>
<span style="font-size: 12.5px; color: #C9CEE6">変更</span>
</a>
<a href="{{lk.consult.href}}" onClick="{{lk.consult.on}}" aria-label="相談する" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1px solid #D3D8E6; color: #34407A; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.3">きょうは、まもる日です。</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #46514D"><span aria-hidden="true">★</span>だけで十分。考えるのは、お休みしましょう。</p>
</div>

<p aria-live="polite" style="margin: 0; font-size: 15px; font-weight: 700; color: #34407A">{{progressText}}</p>

<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #46514D">
<span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #34407A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="14" height="14" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span>起きて、チェックインできた</span>
</div>

<div role="group" aria-label="きょうの★" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<button type="button" role="checkbox" aria-checked="{{it.done}}" onClick="{{it.toggle}}" style="width: 100%; min-height: 68px; box-sizing: border-box; padding: 12px 16px; border-radius: 22px; border: 2px solid {{it.bd}}; background: #FFFFFF; color: #1C2321; font-family: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="flex: none; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{it.ring}}; background: {{it.fill}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<sc-if value="{{it.done}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" width="18" height="18" style="fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 700"><span aria-hidden="true" style="color: #34407A">★ </span>{{it.label}}</span>
<span style="font-size: 13px; color: #56615D">{{it.sub}}</span>
</span>
</button>
</sc-for>
</div>

<sc-if value="{{showBanner}}" hint-placeholder-val="{{ true }}">
<div style="background: #DDE2F0; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700">この2週間、気分の低い日が多めです</span>
<span style="font-size: 13px; color: #2C3550">日曜の2つの質問から。だれかに話してみませんか。</span>
<a href="{{lk.consult2.href}}" onClick="{{lk.consult2.on}}" style="align-self: flex-start; margin-top: 8px; min-height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 1.5px solid #34407A; color: #34407A; text-decoration: none; display: flex; align-items: center; font-size: 14px; font-weight: 700">相談先を見る</a>
</div>
</sc-if>

<nav aria-label="メインメニュー" style="margin: auto -20px 0; height: 76px; background: #FFFFFF; border-top: 1px solid #D3D8E6; display: flex; justify-content: space-around; align-items: center">
<a href="{{lk.home.href}}" onClick="{{lk.home.on}}" aria-current="page" style="min-width: 72px; min-height: 48px; color: #34407A; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>
きょう
</a>
<a href="{{lk.evidence.href}}" onClick="{{lk.evidence.on}}" style="min-width: 72px; min-height: 48px; color: #56615D; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="7" cy="16" r="3"></circle><circle cx="15" cy="17" r="3.5"></circle><circle cx="12" cy="9" r="3"></circle></svg>
きろく
</a>
<a href="{{lk.pause.href}}" onClick="{{lk.pause.on}}" style="min-width: 72px; min-height: 48px; color: #34407A; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #34407A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="17" height="17" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></span>
つらいとき
</a>
<a href="{{lk.insights.href}}" onClick="{{lk.insights.on}}" style="min-width: 72px; min-height: 48px; color: #56615D; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
わかったこと
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nav":{"editor":null},"mode":{"editor":null},"days":{"editor":null},"scene":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const fresh = props.days === 0 || props.scene === 'back';
this.state = { done: fresh ? {} : { light: true } };
}
lk(target, fn) {
const nav = this.props.nav;
if (!nav) return { href: target + '.dc.html', on: null };
return {
href: '#',
on: (e) => {
if (e && e.preventDefault) e.preventDefault();
if (fn) fn(nav); else nav.go(target);
}
};
}
renderVals() {
const done = this.state.done;
const base = [
{ id: 'light', label: '外の光を数分あびる', sub: 'ベランダや窓ぎわでもいい' },
{ id: 'food', label: '水を1杯のんで、何か食べる', sub: '少しだけでいい' },
{ id: 'out', label: '5分だけ外に出る', sub: '出られたら、それで十分' }
];
const items = base.map((it) => {
const d = !!done[it.id];
return Object.assign({}, it, {
done: d,
bd: d ? '#34407A' : '#D3D8E6',
ring: d ? '#34407A' : '#7A8581',
fill: d ? '#34407A' : '#FFFFFF',
toggle: () => {
const next = Object.assign({}, done);
next[it.id] = !d;
this.setState({ done: next });
}
});
});
const count = 1 + items.filter((i) => i.done).length;
return {
showBanner: !(this.props.days === 0 || this.props.scene === 'back'),
items: items,
progressText: 'きょうのできた ' + count + '。それで十分です。',
lk: {
sheet: this.lk('ModeSheet', (n) => n.openSheet()),
consult: this.lk('Consult'),
consult2: this.lk('Consult'),
home: this.lk('HomeRest', () => {}),
evidence: this.lk('Evidence'),
pause: this.lk('Pause'),
insights: this.lk('Insights')
}
};
}
}
</script>
</body>
</html>
