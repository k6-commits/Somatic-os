<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>朝のチェックイン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 10px; background: #F1F3F2; color: #1C2321; font-family: 'Zen Kaku Gothic New', sans-serif; word-break: auto-phrase">

<div style="display: flex; justify-content: space-between; align-items: center">
<p style="margin: 0; font-size: 14px; color: #56615D">11月8日（日）7:42</p>
<a href="{{lk.consult.href}}" onClick="{{lk.consult.on}}" aria-label="相談する" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1px solid #DCE1DF; color: #34407A; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>
</a>
</div>

<h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 23px; line-height: 1.35">おはようございます。<br>まず、からだから。</h1>

<div style="background: #FFFFFF; border: 1px solid #DCE1DF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 700">けさの記録</span>
<span style="font-size: 12.5px; color: #56615D">どれも任意です</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span id="sleep-label" style="font-size: 13.5px; font-weight: 700">ゆうべの睡眠</span>
<span style="font-size: 12px; color: #56615D">時間</span>
</div>
<div role="group" aria-labelledby="sleep-label" style="display: flex; gap: 6px">
<sc-for list="{{sleepOpts}}" as="o" hint-placeholder-count="5">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 1; min-width: 0; height: 44px; padding: 0; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span id="mood-label" style="font-size: 13.5px; font-weight: 700">いまの気分</span>
<span style="font-size: 12px; color: #56615D">1 低い ・ 5 よい</span>
</div>
<div role="group" aria-labelledby="mood-label" style="display: flex; gap: 6px">
<sc-for list="{{moodOpts}}" as="o" hint-placeholder-count="5">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 1; min-width: 0; height: 44px; padding: 0; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span id="fatigue-label" style="font-size: 13.5px; font-weight: 700">からだの疲れ</span>
<span style="font-size: 12px; color: #56615D">1 元気 ・ 5 くたくた</span>
</div>
<div role="group" aria-labelledby="fatigue-label" style="display: flex; gap: 6px">
<sc-for list="{{fatigueOpts}}" as="o" hint-placeholder-count="5">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 1; min-width: 0; height: 44px; padding: 0; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>
</div>

<a href="{{lk.weekly.href}}" onClick="{{lk.weekly.on}}" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: #E3E8F4; color: #34407A; text-decoration: none; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-size: 14.5px; font-weight: 700">日曜日の2つの質問（30秒）</span>
<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">きょうは、どの日にしますか</h2>
<p style="margin: 0; font-size: 13px; color: #56615D">迷ったら「まもる日」で大丈夫。あとで変えられます。</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<a href="{{lk.rest.href}}" onClick="{{lk.rest.on}}" style="min-height: 66px; box-sizing: border-box; padding: 10px 14px; border-radius: 20px; background: #1B2140; color: #EEF0F8; text-decoration: none; display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: #2A3260; color: #E8D8A0; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 18px; font-weight: 700">まもる日</span>
<span style="font-size: 13px; color: #C9CEE6">起きるのも考えるのもつらい</span>
</span>
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none; fill: none; stroke: #C9CEE6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<a href="{{lk.tune.href}}" onClick="{{lk.tune.on}}" style="min-height: 66px; box-sizing: border-box; padding: 10px 14px; border-radius: 20px; background: #C9D3EC; color: #1C2321; text-decoration: none; display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: #E4E9F6; color: #34407A; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M5 8h10M8 12h11M4 16h9M10 20h6"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 18px; font-weight: 700">ととのえる日</span>
<span style="font-size: 13px; color: #2C3550">動けるけれど、からだが重い</span>
</span>
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none; fill: none; stroke: #2C3550; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<a href="{{lk.expand.href}}" onClick="{{lk.expand.on}}" style="min-height: 66px; box-sizing: border-box; padding: 10px 14px; border-radius: 20px; background: #F0B44C; color: #1C2321; text-decoration: none; display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: #F6CD7F; color: #1C2321; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 18px; font-weight: 700">ひろげる日</span>
<span style="font-size: 13px; color: #3D2E0A">ふだんどおり動ける</span>
</span>
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none; fill: none; stroke: #3D2E0A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nav":{"editor":null},"mode":{"editor":null},"days":{"editor":null},"scene":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sleep: null, mood: null, fatigue: null };
}
lk(target, fn) {
const nav = this.props.nav;
if (!nav) return { href: target + '.dc.html', on: null };
return {
href: '#',
on: (e) => {
if (e && e.preventDefault) e.preventDefault();
if (fn) fn(nav); else nav.go(target);
}
};
}
renderVals() {
const mk = (key, labels) => labels.map((label) => {
const on = this.state[key] === label;
return {
label: label,
pressed: on,
bg: on ? '#34407A' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#1C2321',
bd: on ? '#34407A' : '#8A9490',
pick: () => {
const next = {};
next[key] = on ? null : label;
this.setState(next);
}
};
});
return {
sleepOpts: mk('sleep', ['〜5', '5〜6', '6〜7', '7〜9', '9〜']),
moodOpts: mk('mood', ['1', '2', '3', '4', '5']),
fatigueOpts: mk('fatigue', ['1', '2', '3', '4', '5']),
lk: {
consult: this.lk('Consult'),
weekly: this.lk('WeeklyCheck'),
rest: this.lk('HomeRest'),
tune: this.lk('HomeTune'),
expand: this.lk('HomeExpand')
}
};
}
}
</script>
</body>
</html>
