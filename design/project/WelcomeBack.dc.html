<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おかえりなさい</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 14px; background: #F1F3F2; color: #1C2321; font-family: 'Zen Kaku Gothic New', sans-serif; word-break: auto-phrase">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #1B2140; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 50%; background: #E8D8A0"></div></div>
<span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 16px">Somatic OS</span>
</div>
<a href="{{lk.consult.href}}" onClick="{{lk.consult.on}}" aria-label="相談する" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1px solid #DCE1DF; color: #34407A; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>
</a>
</div>

<div aria-hidden="true" style="display: flex; align-items: center; margin-top: 64px">
<span style="width: 56px; height: 56px; border-radius: 50%; background: #1B2140; box-shadow: 0 0 0 4px #F1F3F2"></span>
<span style="width: 56px; height: 56px; margin-left: -12px; border-radius: 50%; background: #C9D3EC; box-shadow: 0 0 0 4px #F1F3F2"></span>
<span style="width: 56px; height: 56px; margin-left: -12px; border-radius: 50%; background: #F0B44C; box-shadow: 0 0 0 4px #F1F3F2"></span>
</div>

<h1 style="margin: 8px 0 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.3">おかえりなさい</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.8; color: #46514D">7日ぶりですね。空いた日のことは、記録しなくて大丈夫です。</p>
<p style="margin: 0; font-size: 16px; line-height: 1.8; color: #46514D">きょうの、いまのからだから始めましょう。</p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="{{lk.checkin.href}}" onClick="{{lk.checkin.on}}" style="min-height: 52px; border-radius: 999px; background: #34407A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">きょうの状態を選ぶ</a>
<a href="{{lk.pause.href}}" onClick="{{lk.pause.on}}" style="min-height: 52px; border-radius: 999px; border: 1.5px solid #34407A; color: #34407A; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">いま、つらい</a>
<a href="{{lk.consult2.href}}" onClick="{{lk.consult2.on}}" style="align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #34407A">話せる窓口を見る</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nav":{"editor":null},"mode":{"editor":null},"days":{"editor":null},"scene":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
lk(target, fn) {
const nav = this.props.nav;
if (!nav) return { href: target + '.dc.html', on: null };
return {
href: '#',
on: (e) => {
if (e && e.preventDefault) e.preventDefault();
if (fn) fn(nav); else nav.go(target);
}
};
}
renderVals() {
return {
lk: {
consult: this.lk('Consult'),
consult2: this.lk('Consult'),
checkin: this.lk('CheckIn'),
pause: this.lk('Pause')
}
};
}
}
</script>
</body>
</html>
